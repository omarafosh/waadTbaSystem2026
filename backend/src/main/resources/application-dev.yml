# ================================================================
# 🛠️ Development Profile - Local Environment Only
# ================================================================
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or: java -jar -Dspring.profiles.active=dev app.jar
# ================================================================

spring:
  main:
    allow-circular-references: true  # DEV: Allow circular dependencies
  datasource:
    url: jdbc:postgresql://localhost:5432/tba_waad_system
    username: postgres
    password: postgres
  
  jpa:
    show-sql: true
    # DEV: Don't validate schema (allow missing tables)
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        # Disable schema validation
        javax.persistence.validation.mode: none
        jakarta.persistence.schema-generation.database.action: none
  
  flyway:
    # 🔧 DEV: Allow checksum validation to be bypassed
    validate-on-migrate: false
    # 🚨 WARNING: Use repair manually if checksums changed
    # Command: mvn flyway:repair
    clean-disabled: false  # Allow clean in dev only

# ==============================
# 🔍 Logging (Verbose for Dev)
# ==============================
logging:
  level:
    root: INFO
    com.waad.tba: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
